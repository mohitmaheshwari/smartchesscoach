# Chess Coach AI - Production Docker Compose Override
# 
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # Production uses the single combined image
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess-coach-app
    restart: always
    ports:
      - "80:80"
    environment:
      - MONGO_URL=${MONGO_URL}
      - DB_NAME=${DB_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      # ─── PWC feature flags ─────────────────────────────────────────
      # 2026-07-08 — Mohit spotted the coach hanging queens in real
      # sessions (session ceda181d: coach played Qxf6 walking into Bh4
      # x-ray, -539cp when gxf6 was -176cp). The guards for this are
      # already coded + wired + tested behind flags in coach_opponent.py
      # — they just never reached prod because docker-compose.yml sets
      # them on the `backend` service which prod DISABLES in favor of
      # this combined `app` service. Fixed here.
      #
      # PWC_COACH_BLUNDER_GUARD (docs/coach_blunder_guard_scope.md):
      #   Vetoes coach moves that hang >=300cp of material to a single
      #   capture, or lose >=500cp on eval, substitutes a sound
      #   candidate. Preserves the coach's calibrated beatable mistakes.
      # PWC_TEACHING_OPPONENT (docs/teaching_opponent_scope.md):
      #   Punish-override — if the student hangs a piece, the weak
      #   engine has to grab it (SEE-verified, one-move only). Makes
      #   the learning consequence land.
      # PWC central pipeline + conductor + every-move-teaches — these
      # were live in the local backend compose, kept parity here.
      - PWC_COACH_BLUNDER_GUARD=true
      - PWC_TEACHING_OPPONENT=true
      - PWC_SKILL_GATE_ENABLED=true
      - PWC_USE_CENTRAL_CAPTION_PIPELINE=true
      - PWC_CENTRAL_CAPTION_TELEMETRY=true
      - PWC_COACH_CONDUCTOR=true
      - PWC_EVERY_MOVE_TEACHES=true
      # GEOMETRY ARROWS (2026-07-10, docs/coach_geometry_arrows_scope.md): living
      # plan overlay — verified pins/forks/loose-targets/open-files/latent lines as
      # green(you)/amber(coach) arrows on the PWC board.
      - PWC_GEOMETRY_ARROWS=true
      - MOTIF_RECOGNITION_CARD=true
      - EXACT_ENDGAME_ENGINE_ENABLED=${EXACT_ENDGAME_ENGINE_ENABLED:-false}
      - EXACT_ENDGAME_REVIEW_ENABLED=${EXACT_ENDGAME_REVIEW_ENABLED:-false}
      - HUMAN_POLICY_EVIDENCE_ENABLED=${HUMAN_POLICY_EVIDENCE_ENABLED:-false}
      - PWC_HUMAN_POLICY_OPPONENT_ENABLED=${PWC_HUMAN_POLICY_OPPONENT_ENABLED:-false}
      - PUZZLE_HUMAN_DIFFICULTY_SHADOW_ENABLED=${PUZZLE_HUMAN_DIFFICULTY_SHADOW_ENABLED:-false}
      - HUMAN_CHESS_ANALYSIS_ENRICHMENT_ENABLED=${HUMAN_CHESS_ANALYSIS_ENRICHMENT_ENABLED:-false}
      - FATHOM_BINARY_PATH=/opt/chessguru/human_chess/bin/fathom
      - FATHOM_BINARY_SHA256=${FATHOM_BINARY_SHA256:-}
      - SYZYGY_TABLEBASE_PATH=/opt/chessguru/human_chess/syzygy
      - SYZYGY_TABLEBASE_BUNDLE_ID=${SYZYGY_TABLEBASE_BUNDLE_ID:-}
      - SYZYGY_TABLEBASE_MANIFEST_SHA256=${SYZYGY_TABLEBASE_MANIFEST_SHA256:-}
      - SYZYGY_MAX_MEN=${SYZYGY_MAX_MEN:-0}
      - OTTER_MODEL_PATH=/opt/chessguru/human_chess/models/otter-0.2.0-eb8dc98b.safetensors
      - MAIA2_MODEL_PATH=/opt/chessguru/human_chess/models/rapid_model.pt
    volumes:
      - ${HUMAN_CHESS_RUNTIME_DIR:-./backend/data/human_chess_runtime}:/opt/chessguru/human_chess:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  mongodb:
    restart: always
    volumes:
      - mongodb_data:/data/db
      - mongodb_backup:/backup
    deploy:
      resources:
        limits:
          memory: 1G

  # Disable development services in production
  backend:
    deploy:
      replicas: 0

  frontend:
    deploy:
      replicas: 0

volumes:
  mongodb_backup:
    driver: local
