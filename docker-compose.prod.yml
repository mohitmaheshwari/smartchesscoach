# Chess Coach AI - Production Docker Compose Override
# 
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # Production uses the single combined image
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess-coach-app
    restart: always
    ports:
      - "80:80"
    environment:
      - MONGO_URL=${MONGO_URL}
      - DB_NAME=${DB_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-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}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  mongodb:
    restart: always
    volumes:
      - mongodb_data:/data/db
      - mongodb_backup:/backup
    deploy:
      resources:
        limits:
          memory: 1G

  # Disable development services in production
  backend:
    deploy:
      replicas: 0

  frontend:
    deploy:
      replicas: 0

volumes:
  mongodb_backup:
    driver: local
