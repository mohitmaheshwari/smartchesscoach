# Chess Coach AI - Production Docker Compose Override
# 
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # Production uses the single combined image
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess-coach-app
    restart: always
    ports:
      - "80:80"
    environment:
      - MONGO_URL=${MONGO_URL}
      - DB_NAME=${DB_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      # ─── Signup gate (docs/invite_only_signup_scope.md) ────────────
      # Was never passed to this service, so the container defaulted it
      # to false and prod sat invite-only. Read from the server .env so
      # the gate can be closed again without a code change — the whole
      # point of the flag (RequestInvite.jsx, Login.jsx, Landing.jsx and
      # AdminWaitlist.jsx all read GET /signup-status and adapt).
      - SIGNUPS_OPEN=${SIGNUPS_OPEN:-false}
      # ─── PWC feature flags ─────────────────────────────────────────
      # 2026-07-08 — Mohit spotted the coach hanging queens in real
      # sessions (session ceda181d: coach played Qxf6 walking into Bh4
      # x-ray, -539cp when gxf6 was -176cp). The guards for this are
      # already coded + wired + tested behind flags in coach_opponent.py
      # — they just never reached prod because docker-compose.yml sets
      # them on the `backend` service which prod DISABLES in favor of
      # this combined `app` service. Fixed here.
      #
      # PWC_COACH_BLUNDER_GUARD (docs/coach_blunder_guard_scope.md):
      #   Vetoes coach moves that hang >=300cp of material to a single
      #   capture, or lose >=500cp on eval, substitutes a sound
      #   candidate. Preserves the coach's calibrated beatable mistakes.
      # PWC_TEACHING_OPPONENT (docs/teaching_opponent_scope.md):
      #   Punish-override — if the student hangs a piece, the weak
      #   engine has to grab it (SEE-verified, one-move only). Makes
      #   the learning consequence land.
      # PWC central pipeline + conductor + every-move-teaches — these
      # were live in the local backend compose, kept parity here.
      - PWC_COACH_BLUNDER_GUARD=true
      - PWC_TEACHING_OPPONENT=true
      - PWC_SKILL_GATE_ENABLED=true
      - PWC_USE_CENTRAL_CAPTION_PIPELINE=true
      - PWC_CENTRAL_CAPTION_TELEMETRY=true
      - PWC_COACH_CONDUCTOR=true
      - PWC_EVERY_MOVE_TEACHES=true
      # Unified experience kill switch + bounded first cohort. Defaults off;
      # the combined production app otherwise ignores values present in .env.
      - PWC_UNIFIED_EXPERIENCE_V1_ENABLED=${PWC_UNIFIED_EXPERIENCE_V1_ENABLED:-false}
      - PWC_UNIFIED_EXPERIENCE_V1_ROLES=${PWC_UNIFIED_EXPERIENCE_V1_ROLES:-admin,super_admin}
      # Read-only policy comparison; this does not expose a V2 runtime.
      - PWC_V2_SHADOW_ENABLED=${PWC_V2_SHADOW_ENABLED:-false}
      - PWC_V2_SHADOW_ROLES=${PWC_V2_SHADOW_ROLES:-admin,super_admin}
      # Unified PWC reads the canonical cross-surface focus through this
      # independently fail-closed bridge. Without passing these variables to
      # the combined image, every eligible returning player receives the
      # thin-history fallback even when a verified active focus exists.
      - COACHING_CONTEXT_V1_ENABLED=${COACHING_CONTEXT_V1_ENABLED:-false}
      - COACHING_CONTEXT_V1_ROLES=${COACHING_CONTEXT_V1_ROLES:-admin,super_admin}
      # GEOMETRY ARROWS (2026-07-10, docs/coach_geometry_arrows_scope.md): living
      # plan overlay — verified pins/forks/loose-targets/open-files/latent lines as
      # green(you)/amber(coach) arrows on the PWC board.
      - PWC_GEOMETRY_ARROWS=true
      - MOTIF_RECOGNITION_CARD=true
      - EXACT_ENDGAME_ENGINE_ENABLED=${EXACT_ENDGAME_ENGINE_ENABLED:-false}
      - EXACT_ENDGAME_REVIEW_ENABLED=${EXACT_ENDGAME_REVIEW_ENABLED:-false}
      - HUMAN_POLICY_EVIDENCE_ENABLED=${HUMAN_POLICY_EVIDENCE_ENABLED:-false}
      - PWC_HUMAN_POLICY_OPPONENT_ENABLED=${PWC_HUMAN_POLICY_OPPONENT_ENABLED:-false}
      - PUZZLE_HUMAN_DIFFICULTY_SHADOW_ENABLED=${PUZZLE_HUMAN_DIFFICULTY_SHADOW_ENABLED:-false}
      - HUMAN_CHESS_ANALYSIS_ENRICHMENT_ENABLED=${HUMAN_CHESS_ANALYSIS_ENRICHMENT_ENABLED:-false}
      - CANDIDATE_CAPTION_ENRICHMENT_ENABLED=${CANDIDATE_CAPTION_ENRICHMENT_ENABLED:-false}
      - CANDIDATE_CAUSAL_CAPTIONS_ENABLED=${CANDIDATE_CAUSAL_CAPTIONS_ENABLED:-false}
      - CANDIDATE_LESSON_REASONS_ENABLED=${CANDIDATE_LESSON_REASONS_ENABLED:-false}
      - FATHOM_BINARY_PATH=/opt/chessguru/human_chess/bin/fathom
      - FATHOM_BINARY_SHA256=${FATHOM_BINARY_SHA256:-}
      - SYZYGY_TABLEBASE_PATH=/opt/chessguru/human_chess/syzygy
      - SYZYGY_TABLEBASE_BUNDLE_ID=${SYZYGY_TABLEBASE_BUNDLE_ID:-}
      - SYZYGY_TABLEBASE_MANIFEST_SHA256=${SYZYGY_TABLEBASE_MANIFEST_SHA256:-}
      - SYZYGY_MAX_MEN=${SYZYGY_MAX_MEN:-0}
      - OTTER_MODEL_PATH=/opt/chessguru/human_chess/models/otter-0.2.0-eb8dc98b.safetensors
      - MAIA2_MODEL_PATH=/opt/chessguru/human_chess/models/rapid_model.pt
    volumes:
      - ${HUMAN_CHESS_RUNTIME_DIR:-./backend/data/human_chess_runtime}:/opt/chessguru/human_chess:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  mongodb:
    restart: always
    volumes:
      - mongodb_data:/data/db
      - mongodb_backup:/backup
    # The kernel must not pick the database when the box fills up.
    #
    # 2026-10-23: mongod was OOM-killed 5 times and restarted 20 times in
    # one day. The box is shared with another product and runs at 13.7GB of
    # 16GB with ~300MB free, so the kernel kills the largest single process
    # -- which is the database. Each kill lost whatever an analysis was
    # mid-way through writing, and because every phase swallows its Mongo
    # errors the job still reported success: two games kept stale
    # move_evaluations and a third finished with 47 faulted moves and no
    # captions, all reading status=completed.
    #
    # -500 took mongod's oom_score from 744 -- the top target on the box --
    # to 411, below the python workers at 690-735. A stateless worker dies
    # and restarts instead; the database survives.
    oom_score_adj: -500
    deploy:
      resources:
        limits:
          # 3G, not the 1G this said until today. mongod runs with
          # --wiredTigerCacheSizeGB 1.5 and sits at 1.8-2.3GB RSS, so a 1G
          # cap would have its own cgroup killing it continuously.
          #
          # It never bit because Compose applies limits at CREATION and
          # this container has only ever been restarted -- `docker inspect`
          # reports memlimit=0 against a file that says 1G. The next deploy
          # that recreated mongodb would have capped a 2GB process at 1GB.
          memory: 3G

  # Disable development services in production
  backend:
    deploy:
      replicas: 0

  frontend-builder:
    deploy:
      replicas: 0

volumes:
  mongodb_backup:
    driver: local
