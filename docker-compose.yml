# Chess Coach AI - Docker Compose Configuration
#
# Usage:
#   docker compose up -d --build
#
# This builds the frontend, deploys it to the host nginx directory,
# and runs backend + MongoDB in Docker.
#
# Host nginx serves the frontend static files from /var/www/chessguru.ai
#   (this MUST match `root` in /etc/nginx/sites-enabled/chessguru.ai and the
#    frontend-builder volume below -- see the note on that volume)
# Host nginx proxies /api to localhost:8002 (backend container)

services:
  # ============================================
  # MongoDB Database
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: chess-coach-mongodb
    restart: unless-stopped
    ports:
      # Bound to localhost only (2026-07-14 security hardening): the DB was
      # publicly reachable on 0.0.0.0 with root creds. Remote access goes via
      # SSH tunnel (ssh -L 27018:localhost:27017), never a public bind.
      - "27017:27017"
    # The whole dataset is well under a gigabyte; the default cache ceiling of
    # ~half of host RAM was holding mostly air on a shared 15GB machine.
    command: ["mongod", "--wiredTigerCacheSizeGB", "1.5"]
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=chess_coach
      - MONGO_INITDB_ROOT_USERNAME=admin_user_mii_s_c
      # Secret comes from the untracked project-root .env (same pattern as SMTP/Razorpay).
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    healthcheck:
      # `mongosh --eval` boots a full JavaScript shell for one ping. On a
      # loaded box that does not finish in 5s, so the check failed 2,590 times
      # consecutively while the database itself answered queries fine -- and
      # because the backend has `depends_on: condition: service_healthy`, every
      # `docker compose up` blocked on it. Deploys were silently gated behind a
      # liveness probe, not a real outage.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  # ============================================
  # Backend API (FastAPI + Stockfish)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # 2026-08-07: set at deploy time with
        # `GIT_COMMIT=$(git rev-parse HEAD) docker compose up -d --build`.
        # Defaults to "unknown" if omitted -- verify_deployment.py's
        # commit-match check will SKIP (not fail) rather than false-pass.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: chess-coach-backend
    restart: unless-stopped
    ports:
      # 2026-06-06: host 8002 (NOT 8001). 8001 is taken by matrimonial_fastapi
      # on this server; binding it collides and the backend can't start. This
      # reverts an errant 8001 change. nginx proxies to 8002.
      - "8002:8002"
    environment:
      # All secrets come from the untracked project-root .env (same pattern as
      # SMTP/Razorpay below). NEVER put a real credential as a fallback default
      # here — this file is git-tracked. (2026-07-14 hardening: previous
      # committed defaults for the OpenAI key / Google secret / Mongo password
      # must be treated as leaked and rotated.)
      - MONGO_URL=${MONGO_URL:?set MONGO_URL in .env}
      - DB_NAME=chess_coach
      # Default OFF. DEV_MODE=true silently authenticates any anonymous request
      # as the dev user (and grants Pro) — local dev opts in via .env only.
      - DEV_MODE=${DEV_MODE:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-780116053739-2eh0431pndqofkbga1m0o7j35p3bklvt.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://chessguru.ai/api/auth/google/callback}
      # PWC central-pipeline migration (2026-06-08). The divergence baseline
      # (commit 22eac125) confirmed a clear win: 100% content agreement where
      # both engines speak, 89% of one-silent cases are central enrichment PWC
      # missed, and PWC-only cases were filler/cp=0 false positives. So the
      # ACTIVE flag is now ON — PWC move captions route through the central
      # caption pipeline, inheriting all the Lab caption quality (simple-English,
      # root-cause fixes, verified templates, one voice). Telemetry stays on to
      # keep monitoring divergence in prod after the flip.
      - PWC_CENTRAL_CAPTION_TELEMETRY=true
      - PWC_USE_CENTRAL_CAPTION_PIPELINE=true
      # EVERY-MOVE-TEACHES (2026-06-25, docs/pwc_every_move_teaches_scope.md):
      # un-gate the user-move caption so EVERY move shows the central library's
      # verified teaching line instead of a bare good/bad badge (the policy gate
      # was discarding a caption already written — same text as review, proven
      # byte-identical). Code default is OFF; this flips it ON for prod.
      # Kill-switch: set to false to revert without a code change.
      - PWC_EVERY_MOVE_TEACHES=true
      # COACH CONDUCTOR (2026-06-27, docs/pwc_coach_conductor_scope.md): the player-
      # model memory. Loads each player's motif digest and, when an engine-confirmed
      # weak-pattern recurs (walk into a fork, miss a skewer), the coach names the
      # thread as a STATEMENT ("the skewer again — slipping on you") with restraint
      # (<=1/thread/game). Kill-switch: set to false. Validated on 1933 real moves +
      # live path 5/5; door-latency worry was test contention, not real.
      - PWC_COACH_CONDUCTOR=true
      # COACH BLUNDER GUARD (2026-06-27, docs/coach_blunder_guard_scope.md): a
      # soundness floor on the coach's OWN moves. Stockfish weakening makes the coach
      # play worse INHUMANLY — it occasionally hangs a queen, which breaks trust. The
      # guard vetoes a catastrophe (free piece hang / forced rook+ loss / walk into
      # mate) and substitutes a sound move, while leaving the coach's calibrated,
      # beatable mistakes intact. Measured: catastrophe-rate -> 0 at every level,
      # beatability preserved (fires on ~10% of moves). Adds one full-strength depth-14
      # analyse per coach move (~watch coach-move latency). Kill-switch: set false.
      - PWC_COACH_BLUNDER_GUARD=true
      # TEACHING OPPONENT (2026-07-08, docs/teaching_opponent_scope.md): the mirror
      # of the blunder guard. If the student hangs a piece, the weakened engine has
      # to grab it — one-move SEE-verified, ~one calc per move. Without this, the
      # student's mistakes go unpunished and the lesson never lands.
      - PWC_TEACHING_OPPONENT=true
      # GEOMETRY ARROWS (2026-07-10, docs/coach_geometry_arrows_scope.md): living
      # plan overlay on the PWC board — green=your plan, amber=coach's plan,
      # every arrow board-verified. Phase 1.
      - PWC_GEOMETRY_ARROWS=true
      # PWC SKILL GATE (docs/pwc_skills_aware_coaching.md, shipped v2 2026-06-03):
      # DOWNGRADE mastered nudges → "You've handled this before — quick reminder."
      # ESCALATE struggle → "You've missed this pattern 3 times before — let's lock it in."
      # Was built + wired + tested, then defaulted OFF for a live-check that never
      # ran. Flipping on per Mohit 2026-07-08 sign-off.
      - PWC_SKILL_GATE_ENABLED=true
      # Tactics recognition card on /progress (per-opportunity fork/pin/skewer recognition,
      # last-15-days rate + population percentile). docs/motif_recognition_card_scope.md
      # Kill-switch: set to false to hide the card without a redeploy.
      - MOTIF_RECOGNITION_CARD=true
      # VERIFIED + DISTILLED CAPTIONS (2026-07-14, W5 of the broken-wires fix):
      # the validated quality layers, previously dark. VERIFIED_CAPTIONS adds the
      # board-verified "attacks" reason for near-best quiet moves (98/98 verified,
      # purely additive). DISTILLED_CAPTIONS_ENABLED swaps caption text with the
      # distilled-template render when available+engine-verified (91% coverage /
      # 99% truth on 46k moves; abstain keeps the existing caption). Values come
      # from .env so either can be killed WITHOUT a rebuild: set to 0/false in
      # .env + `docker compose up -d backend`.
      - VERIFIED_CAPTIONS=${VERIFIED_CAPTIONS:-false}
      - DISTILLED_CAPTIONS_ENABLED=${DISTILLED_CAPTIONS_ENABLED:-0}
      # LIVE OPENING NUDGE (2026-06-02, docs/pwc_realtime_opening_guidance.md):
      # per-move in-book curriculum coaching during live PWC play. Only fires
      # when the session has a detected/taught opening AND the position is
      # still in book; wrapped in a broad try/except that falls through
      # silently on any error. Built, wired, never flipped — flipping 2026-08-03.
      - PWC_LIVE_OPENING_NUDGE_ENABLED=true
      # GAP ENRICHMENT (docs/pwc_live_analysis_reuse_scope.md): gives PWC-played
      # games the same cognitive_gap enrichment imported games get, via the
      # shared enrich_with_cognitive_gaps() function. Flipping 2026-08-03 — run
      # scripts/regen_coach_game_gaps.py --apply afterward to backfill existing
      # PWC games (new games get it automatically going forward regardless).
      - PWC_GAP_ENRICHMENT=true
      # MOVE QUALITY RATING (docs/move_quality_rating_scope.md): deterministic,
      # EWMA-based move-quality rating for PWC, shown as a band rather than a
      # point, meant to eventually replace/supplement imported chess.com/Lichess
      # Elo for the 600-1500 audience. Falls back to imported rating on any
      # error (coach_game_session.py try/except). Flipping 2026-08-03.
      - PWC_MOVE_QUALITY_RATING=true
      # Post-game digest emails (docs/activation_scope.md): dry|pilot|live,
      # read at send time from .env — flip without rebuild.
      - DIGEST_EMAILS_MODE=${DIGEST_EMAILS_MODE:-dry}
      - DIGEST_SEND_HOUR_UTC=${DIGEST_SEND_HOUR_UTC:-2}
      - LICHESS_CLIENT_ID=chessguru-app
      - LICHESS_REDIRECT_URI=https://chessguru.ai/api/oauth/lichess/callback
      - FRONTEND_URL=https://chessguru.ai
      # SMTP (Zoho) — values come from the project-root .env (see setup_smtp.sh)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      # Razorpay — values come from the project-root .env (see scripts/set-env.sh)
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================
  # Analysis Worker (dedicated, scalable) — 2026-06-06
  # ============================================
  # Drains the analysis_queue in parallel with N replicas. Reuses the
  # backend image (Stockfish baked in) and runs the existing worker loop
  # (analysis_worker.run_worker via __main__) which has NO single-job
  # throttle and claims atomically (find_one_and_update) — so multiple
  # replicas are race-safe. The in-app fallback in server.py stays as a
  # safety net (it self-throttles and yields whenever anything is processing).
  #
  # NO container_name — required so `docker compose up -d --scale
  # analysis-worker=N` can run N replicas. Default replica count set at
  # deploy via --scale (recommend 4: 12 cores, 1 thread/engine, ~2G/4 mem).
  #
  # Env is intentionally minimal: analysis only needs Mongo + Stockfish +
  # (the legacy/dead) OpenAI key. Auth/SMTP/Razorpay are API-only.
  analysis-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "analysis_worker.py"]
    restart: unless-stopped
    # Disable the inherited Dockerfile.backend HEALTHCHECK: it curls
    # localhost:8002/api/health, but workers run analysis_worker.py (no
    # API server), so it always reports "unhealthy" — a false signal.
    # The worker's real liveness is the queue draining, not an HTTP probe.
    healthcheck:
      disable: true
    environment:
      # Secrets from untracked .env — see the backend service note.
      - MONGO_URL=${MONGO_URL:?set MONGO_URL in .env}
      - DB_NAME=chess_coach
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

  # ============================================
  # Frontend Builder (builds React & deploys to host nginx dir)
  # ============================================
  # This service builds the frontend and copies it to the host path
  # where nginx serves static files. It exits after the copy is done.
  frontend-builder:
    build:
      context: .
      dockerfile: Dockerfile.frontend.build
    container_name: chess-coach-frontend-builder
    volumes:
      # This path MUST equal nginx's `root` for chessguru.ai. It did not
      # between 2026-08-07 and 2026-08-28: the builder wrote to
      # /var/www/html/SMART_CHESS_COACH while nginx served
      # /var/www/chessguru.ai, so `docker compose up -d --build` reported
      # success and three weeks of frontend work never reached a user.
      # A green build is not a deploy -- verify the live bundle hash after
      # shipping, not the exit code.
      - /var/www/chessguru.ai:/output
    # Runs once (build + copy), then exits — that's expected
    restart: "no"

volumes:
  mongodb_data:
    driver: local

networks:
  default:
    name: chess-coach-network
