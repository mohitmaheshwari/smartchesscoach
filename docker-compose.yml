# Chess Coach AI - Docker Compose Configuration
# 
# Usage:
#   docker compose up -d --build
#
# This runs the complete app (frontend + backend + nginx) in a single container,
# plus MongoDB as a separate service.
#
# Environment variables (set in .env file or export before running):
#   - OPENAI_API_KEY: API key for LLM integration
#   - GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET: For Google OAuth
#   - GOOGLE_REDIRECT_URI: OAuth callback URL (default: https://chessguru.ai/api/auth/google/callback)

services:
  # ============================================
  # MongoDB Database
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: chess-coach-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=chess_coach
      - MONGO_INITDB_ROOT_USERNAME=admin_user_mii_s_c
      - MONGO_INITDB_ROOT_PASSWORD=Mii123$44$
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # App (Frontend + Backend + Nginx — single container)
  # ============================================
  # Uses the multi-stage Dockerfile:
  #   Stage 1: Builds React frontend (yarn build)
  #   Stage 2: Python runtime + nginx + supervisor
  #   Nginx serves frontend static files + proxies /api/ to backend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess-coach-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - MONGO_URL=mongodb://admin_user_mii_s_c:Mii123$44$@mongodb:27017
      - DB_NAME=chess_coach
      - OPENAI_API_KEY=${OPENAI_API_KEY:-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}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-780116053739-2eh0431pndqofkbga1m0o7j35p3bklvt.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://chessguru.ai/api/auth/google/callback}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  mongodb_data:
    driver: local

networks:
  default:
    name: chess-coach-network
