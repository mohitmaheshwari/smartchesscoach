<style>

width:27%;aspect-ratio:1;border-radius:50%;background:#20483170;position:absolute;left:36%;top:36%}#cg-atelier .cg-coord{position:absolute;left:3px;top:2px;font:9px/1.1 Manrope,sans-serif;opacity:.85}#cg-atelier .cg-piece{position:absolute;width:12.5%;height:12.5%;left:0;top:0;pointer-events:none;transition:transform .52s cubic-bezier(.2,.75,.2,1),opacity .2s;z-index:3;filter:drop-shadow(0 2px 1px #10231b24);display:grid;place-items:center}#cg-atelier .cg-piece img{width:95%;height:95%;display:block}#cg-atelier .cg-piece.cg-captured{opacity:0}#cg-atelier .cg-board-foot{font-size:11px;color:#486048;display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:10px;min-height:22px}#cg-atelier .cg-board-foot span{display:flex;align-items:center;gap:5px}

#cg-atelier .cg-bottom{margin-top:29px;padding-top:20px;border-top:1px solid var(--cg-border)}#cg-atelier .cg-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:12px}#cg-atelier .cg-section-title strong{font-weight:700}#cg-atelier .cg-section-title span{font-size:11px;color:var(--cg-secondary)}#cg-atelier .cg-options{display:grid;grid-template-columns:1fr 1fr;gap:14px}#cg-atelier .cg-option{background:var(--cg-paper);border:1px solid var(--cg-border);padding:16px;border-radius:12px;text-align:left;display:flex;align-items:center;gap:13px;color:var(--cg-text);transition:transform .2s,border-color .2s}#cg-atelier .cg-option:hover{transform:translateY(-2px);border-color:#9caf8b}#cg-atelier .cg-option strong{font-size:12px;display:block}#cg-atelier .cg-option small{font-size:11px;color:var(--cg-secondary);display:block;margin-top:3px}#cg-atelier .cg-option>svg{width:23px;height:23px;color:#6c835c}#cg-atelier .cg-option>span{flex:1}#cg-atelier .cg-option .cg-arrow{width:14px}
#cg-atelier .cg-stepper{display:flex;align-items:center;gap:7px;font-size:10px;color:#52664e;flex-wrap:wrap;margin-bottom:20px}#cg-atelier .cg-stepper span{padding:4px 0}#cg-atelier .cg-stepper .cg-step-active{font-weight:800;color:#264c32}#cg-atelier .cg-stepper b{display:block;width:20px;height:1px;background:#bdcdb3}#cg-atelier .cg-feedback{background:#edf4e3;border:1px solid #d6e6c7;border-radius:11px;padding:13px;display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#305633;width:100%}#cg-atelier .cg-feedback svg{margin-top:2px}#cg-atelier .cg-feedback strong{display:block;margin-bottom:3px}#cg-atelier .cg-replay{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:13px;border-top:1px solid #cbd6c0;margin-top:12px}#cg-atelier .cg-replay button{height:34px;min-width:34px;padding:5px 8px;background:#f6f8ef;border:1px solid #cdd7c2;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#375435}#cg-atelier .cg-replay-controls{display:flex;gap:5px}#cg-atelier .cg-replay-caption{font-size:11px;color:#40563b}#cg-atelier .cg-success-icon{width:49px;height:49px;border-radius:50%;background:#ddedc8;display:grid;place-items:center;color:#31552c}#cg-atelier .cg-success-icon svg{width:24px;height:24px}#cg-atelier .cg-complete{max-width:540px;margin:32px auto 20px;padding:30px 0;text-align:center;display:flex;align-items:center;flex-direction:column;gap:22px}#cg-atelier .cg-complete h1{font-size:45px}#cg-atelier .cg-complete blockquote{font-family:'Instrument Serif',Georgia,serif;font-size:27px;line-height:1.35;margin:0;color:#46623e}#cg-atelier .cg-complete p{font-size:13px;color:var(--cg-secondary);max-width:385px}#cg-atelier .cg-record{margin-top:27px;border-top:1px solid var(--cg-border)}#cg-atelier .cg-record-row{padding:22px 0;display:flex;gap:17px;border-bottom:1px solid var(--cg-border)}#cg-atelier .cg-record-row>svg{margin-top:4px;color:#668153}#cg-atelier .cg-record-row strong{display:block;font-size:14px}#cg-atelier .cg-record-row p{font-size:12px;color:var(--cg-secondary);margin-top:5px}#cg-atelier .cg-soft-panel{padding:22px;background:#ecf1e5;border:1px solid #d9e2ce;border-radius:12px;margin-top:24px}#cg-atelier .cg-soft-panel h3{font-size:15px;margin-bottom:8px}#cg-atelier .cg-soft-panel p{font-size:12px;color:var(--cg-secondary)}#cg-atelier .cg-appear{animation:cg-soft-in .32s ease-out}#cg-atelier .cg-success-icon{animation:cg-mark .4s cubic-bezier(.2,.7,.3,1.1)}@keyframes cg-soft-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes cg-mark{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

<div id="cg-atelier" aria-label="ChessGuru premium coaching-room preview">
 <div class="cg-disclosure"><span>CHESSGURU · INTERACTIVE DESIGN STUDY</span><span>Example lesson · Not connected to your account</span></div>
 <div class="cg-shell">
  <aside class="cg-side">
   <div class="cg-brand"><span class="cg-brand-icon"><i data-lucide="crown" aria-hidden="true"></i></span>ChessGuru</div>
   <nav class="cg-nav" aria-label="Coaching room pages">
    <button type="button" data-page="home" aria-current="page"><i data-lucide="house" aria-hidden="true"></i>Today</button>
    <button type="button" data-page="learn"><i data-lucide="book-open" aria-hidden="true"></i>Learn</button>
    <button type="button" data-page="review"><i data-lucide="scan-eye" aria-hidden="true"></i>Game Review</button>
    <button type="button" data-page="progress"><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i>Progress</button>
    <button type="button" data-page="play"><i data-lucide="swords" aria-hidden="true"></i>Play with Coach</button>
   </nav>
   <div class="cg-side-note">A little more<br>understanding.<br>Every time.</div>
   <div class="cg-profile"><span class="cg-monogram">M</span><span>Mohit<br><small>Your coaching room</small></span></div>
  </aside>
  <main class="cg-main">
   <div class="cg-top"><span id="cg-breadcrumb">Your coaching room</span><span><b class="cg-presence"></b>Space to think. A coach to guide you.</span></div>
   <div id="cg-scene"></div>
  </main>
 </div>
</div>
<script>
(()=>{
const root=document.getElementById('cg-atelier'),scene=root.querySelector('#cg-scene');
const config={board:'Sage',motion:true};
let page='home',mode='intro',selected=false,hint=false,frame=0,timer=null,done=false;
const initial='3r1rk1/p2p1ppp/2p1p3/8/N3P3/1P1RPP2/P1q4P/3R2K1';
const startFen='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';
const names={K:'king',Q:'queen',R:'rook',B:'bishop',N:'knight',P:'pawn'};
let pieces=[];
function icon(n){return '<i data-lucide="'+n+'" aria-hidden="true"></i>'}
function hydrate(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}})}
function primary(text,id){return '<button type="button" class="cg-primary" data-action="'+id+'">'+text+icon('arrow-right')+'</button>'}
function link(text,id){return '<button type="button" class="cg-text-btn" data-action="'+id+'">'+text+'</button>'}
function stop(){if(timer){clearInterval(timer);timer=null}}
function parse(fen){const out=[];fen.split('/').forEach((r,y)=>{let x=0;for(const c of r){if(Number(c))x+=Number(c);else{out.push({id:'piece-'+x+'-'+y,type:(c===c.toUpperCase()?'w':'b')+c.toUpperCase(),x,y,original:'abcdefgh'[x]+(8-y)});x++}}});return out}
function boardMarkup(fen=initial){pieces=parse(fen);let squares='';for(let y=0;y<8;y++)for(let x=0;x<8;x++){const sq='abcdefgh'[x]+(8-y);squares+='<button type="button" class="cg-square '+((x+y)%2?'cg-dark':'')+'" data-square="'+sq+'" aria-label="Square '+sq+'">'+(x===0||y===7?'<span class="cg-coord">'+(x===0?8-y:'abcdefgh'[x])+'</span>':'')+'</button>'}return '<div class="cg-board-wrap"><div class="cg-board-label"><span>PIECE SAFETY</span><span id="cg-turn">White to move</span></div><div class="cg-board" aria-label="Interactive example chess position"><div class="cg-squares">'+squares+'</div>'+pieces.map(p=>'<span class="cg-piece" id="cg-'+p.id+'" style="transform:translate('+p.x*100+'%,'+p.y*100+'%)"><img src="https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/'+p.type+'.svg" alt="'+(p.type[0]==='w'?'White ':'Black ')+names[p.type[1]]+' on '+p.original+'" draggable="false"></span>').join('')+'</div><div class="cg-board-foot"><span>'+icon('circle')+' <span id="cg-board-status">A position to explore</span></span><span>Example lesson</span></div><div id="cg-replay-slot"></div></div>'}
function coachId(){return '<div class="cg-coach-id"><span class="cg-coach-avatar">'+icon('sprout')+'</span><span><strong>Your coach</strong>Let’s understand it together.</span></div>'}
function options(){return '<section class="cg-bottom"><div class="cg-section-title"><strong>Another way to spend today</strong><span>Your lesson will be here when you return.</span></div><div class="cg-options"><button type="button" class="cg-option" data-page="play">'+icon('swords')+'<span><strong>Play a game with me</strong><small>Space to try what you’re learning.</small></span>'+icon('arrow-up-right')+'</button><button type="button" class="cg-option" data-page="import">'+icon('link')+'<span><strong>Bring your own games</strong><small>Connect Chess.com or Lichess.</small></span>'+icon('arrow-up-right')+'</button></div></section>'}
function heading(kicker,title,sub=''){return '<p class="cg-kicker">'+kicker+'</p><h1>'+title+'</h1>'+(sub?'<p class="cg-intro">'+sub+'</p>':'')}
function render(){stop();root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});root.querySelector('#cg-breadcrumb').textContent=page==='lesson'?'Learn / Piece safety':'Your coaching room';
let html='';
if(page==='home'||page==='learn'||page==='review'){
const review=page==='review',learn=page==='learn';
html=heading(review?'LOOK BEYOND THE MOVE':learn?'YOUR LEARNING SPACE':'WELCOME BACK, MOHIT',review?'One decision.<br>A different <em>possibility.</em>':learn?'Less memorising.<br>More <em>understanding.</em>':'Let’s make your next move<br>a little more <em>considered.</em>',review?'Explore the alternative on the board, one move at a time.':learn?'Start with one idea. See it. Try it. Take it into a game.':'The board is ready. Let’s work through one useful idea.')+'<div class="cg-workspace">'+boardMarkup()+'<section class="cg-coach">'+coachId()+'<h2>They don’t have to<br>face the queen alone.</h2><p class="cg-speech">Both rooks are under attack. Can you find a way for them to help each other?</p>'+primary('Let’s look together','begin')+'<div class="cg-coach-divider"></div><p class="cg-fine">'+(review?'Illustrative study. In your account, this space would identify the selected game and the reason for choosing it.':'One board. One idea. We’ll move at your pace.')+'</p></section></div>'+options();
}else if(page==='lesson'){
html='<div class="cg-stepper"><span class="cg-step-active">01 · Find the idea</span><b></b><span>02 · See why</span><b></b><span>03 · Take it with you</span></div>'+heading('PIECE SAFETY','A little help from<br>the <em>other rook.</em>')+'<div class="cg-workspace">'+boardMarkup()+'<section class="cg-coach" id="cg-coach-panel"></section></div><div class="cg-bottom">'+link('← Back to your coaching room','home')+'<p class="cg-fine">Interactive design example: select the rook on d3, then d2. Other moves are not graded in this preview.</p></div>';
}else if(page==='complete'){
html='<section class="cg-complete"><span class="cg-success-icon">'+icon('check')+'</span><p class="cg-kicker">A GOOD PLACE TO PAUSE</p><h1>That’s an idea<br>worth <em>keeping.</em></h1><blockquote>“If they take this piece,<br>which piece can take back?”</blockquote><p>You’ve explored the rook connection. Finding it in a new position, without help, is the next step.</p>'+primary('Back to my coaching room','home')+link('See what this records →','progress')+'<p class="cg-fine">Demonstration complete · Nothing saved to your account</p></section>';
}else if(page==='progress'){
html=heading('YOUR LEARNING, HONESTLY','Small steps.<br><em>Real understanding.</em>','Practising an idea is a start. Using it in your own games is a different step.')+'<div class="cg-record"><div class="cg-record-row">'+icon(done?'circle-check':'book-open')+'<div><strong>'+(done?'You explored a rook connection':'Your next idea: pieces helping each other')+'</strong><p>'+(done?'A guided example completed in this preview.':'Start with the board. You don’t need to choose a course.')+'</p></div></div><div class="cg-record-row">'+icon('scan-eye')+'<div><strong>Recognising it without help</strong><p>A fresh position is the next check. Following a demonstration doesn’t establish mastery.</p></div></div><div class="cg-record-row">'+icon('flag')+'<div><strong>Seeing it in your games</strong><p>This preview has no account data. A live comparison belongs here only when we have the evidence.</p></div></div></div><div class="cg-bottom">'+primary(done?'Revisit the idea':'Explore the idea','begin')+'</div>';
}else if(page==='play'){
html=heading('PLAY WITH COACH','Your game.<br>A little <em>guidance.</em>','A focused board, with your coach beside you.')+'<div class="cg-workspace">'+boardMarkup(startFen)+'<section class="cg-coach">'+coachId()+'<h2>Take your time.<br>I’m here to help.</h2><p class="cg-speech">Coaching belongs beside the decision—not in a feed competing for your attention.</p><div class="cg-coach-divider"></div><p class="cg-fine">Playing-room design only. No game or opponent is started here.</p>'+primary('Try the interactive lesson','begin')+'</section></div>';
}else if(page==='import'){
html=heading('YOUR GAMES BELONG HERE','Let’s start with<br><em>your chess.</em>','Connect Chess.com or Lichess. While your games are being analysed, there’s already something useful to try.')+'<div class="cg-soft-panel"><h3>A clear handoff, never a dead end.</h3><p>The live connection flow should show importing and analysis separately, preserve your place, and bring you back when your own-game lesson is ready.</p></div><div class="cg-bottom">'+primary('Explore a position meanwhile','begin')+'<p class="cg-fine" style="margin-top:14px">Design preview · No account will be connected.</p></div>';
}
scene.innerHTML='<div class="cg-appear">'+html+'</div>';if(page==='lesson'){coach();updateBoard()}if(page==='play'){root.querySelector('.cg-board-label span').textContent='PLAYING ROOM'}hydrate();
}
function coach(){const panel=root.querySelector('#cg-coach-panel');if(!panel)return;let body=coachId();if(mode==='try')body+='<h2>Where could these<br>rooks help each other?</h2><p class="cg-speech">Select the rook on d3, then the square d2.</p>'+(hint?'<div class="cg-feedback">'+icon('lightbulb')+'<span>Look along the d-file. If the queen captures on d2, your rook on d1 has a reply.</span></div>':'')+link(hint?'Hide the hint':'Give me a hint','hint')+'<div class="cg-coach-divider"></div><p class="cg-fine">A guided move for this design demonstration—not a scored test.</p>';else if(mode==='feedback')body+='<div class="cg-feedback">'+icon('circle-check')+'<span><strong>You’ve connected the rooks.</strong>Now there’s a recapture if the queen takes on d2.</span></div><h2>A rook with<br>someone behind it.</h2><p class="cg-speech">Let’s watch what happens if Black takes the rook. You can pause and go back at any point.</p>'+primary('Show me why','watch')+link('Try the move again','retry');else body+='<p class="cg-kicker">'+['THE CONNECTION','A POSSIBLE CAPTURE','THE RECAPTURE'][frame]+'</p><h2>'+['The rooks now<br>share the d-file.','If the queen<br>takes the rook…','…the other rook<br>takes back.'][frame]+'</h2><p class="cg-speech">'+['Your rook on d1 can recapture on d2. An attacked piece isn’t always a free piece.','Black has taken a rook, but White still has a reply. Watch the rook on d1.','White gives up one rook and captures the queen in this continuation. That is why the recapture matters.'][frame]+'</p><div class="cg-coach-divider"></div><p class="cg-fine">A possible continuation, not a forced queen capture or a claim that this is the best move.</p>'+primary('I see the idea','finish');panel.innerHTML=body;panel.classList.remove('cg-appear');void panel.offsetWidth;panel.classList.add('cg-appear');hydrate()}
function coordinates(p){if(p.original==='d3')return frame===0?{x:3,y:6}:{x:3,y:6,hidden:true};if(p.original==='c2')return frame===0?{x:2,y:6}:frame===1?{x:3,y:6}:{x:3,y:6,hidden:true};if(p.original==='d1')return frame===2?{x:3,y:6}:{x:3,y:7};return p}
function updateBoard(){if(page!=='lesson')return;const advanced=mode!=='try';for(const p of pieces){const el=root.querySelector('#cg-'+p.id),pos=advanced?coordinates(p):p;el.style.transform='translate('+pos.x*100+'%,'+pos.y*100+'%)';el.style.transition=config.motion?'':'none';el.classList.toggle('cg-captured',!!pos.hidden);el.querySelector('img').alt=(p.type[0]==='w'?'White ':'Black ')+names[p.type[1]]+(pos.hidden?' captured':' on '+'abcdefgh'[pos.x]+(8-pos.y));}root.querySelectorAll('[data-square]').forEach(s=>{s.classList.toggle('cg-selected',selected&&s.dataset.square==='d3');s.classList.toggle('cg-target',selected&&s.dataset.square==='d2');s.classList.toggle('cg-trace',advanced&&(frame===0?['d3','d2']:frame===1?['c2','d2']:['d1','d2']).includes(s.dataset.square))});root.querySelector('#cg-turn').textContent=advanced?(frame===1?'White to move':'Black to move'):'White to move';root.querySelector('#cg-board-status').textContent=mode==='try'?(selected?'Now select d2':'Select the rook on d3'):['Rook d3 → d2','Queen c2 → d2','Rook d1 → d2'][frame];const slot=root.querySelector('#cg-replay-slot');slot.innerHTML=mode==='watch'?'<div class="cg-replay"><span class="cg-replay-caption">'+(frame+1)+' / 3 · Example line</span><div class="cg-replay-controls"><button type="button" data-action="previous" aria-label="Previous move" '+(frame===0?'disabled':'')+'>'+icon('chevron-left')+'</button><button type="button" data-action="toggle" aria-label="'+(timer?'Pause replay':'Play replay')+'">'+icon(timer?'pause':'play')+'</button><button type="button" data-action="next" aria-label="Next move" '+(frame===2?'disabled':'')+'>'+icon('chevron-right')+'</button></div></div>':'';hydrate();const steps=root.querySelectorAll('.cg-stepper span');steps.forEach((s,i)=>s.classList.toggle('cg-step-active',i===(mode==='try'?0:1)))}
function play(){stop();if(frame===2)frame=0;timer=setInterval(()=>{if(page!=='lesson'||mode!=='watch'){stop();return}frame++;if(frame>=2){frame=2;stop()}updateBoard();coach()},1900);updateBoard();coach()}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.page){page=b.dataset.page;render();return}if(b.dataset.square){if(page!=='lesson'||mode!=='try')return;if(b.dataset.square==='d3'){selected=!selected;updateBoard()}else if(b.dataset.square==='d2'&&selected){selected=false;mode='feedback';frame=0;updateBoard();coach()}return}switch(b.dataset.action){case'begin':page='lesson';mode='try';frame=0;hint=false;selected=false;render();break;case'home':page='home';render();break;case'progress':page='progress';render();break;case'hint':hint=!hint;coach();break;case'retry':stop();mode='try';selected=false;frame=0;updateBoard();coach();break;case'watch':mode='watch';frame=0;play();break;case'toggle':if(timer){stop();updateBoard()}else play();break;case'previous':case'next':stop();frame=Math.max(0,Math.min(2,frame+(b.dataset.action==='next'?1:-1)));updateBoard();coach();break;case'finish':done=true;page='complete';render();break;default:break}});
function applyDesign(){root.style.setProperty('--cg-square',config.board==='Sage'?'#8eaa8d':'#b2987b');root.style.setProperty('--cg-light',config.board==='Sage'?'#e9eadb':'#f0e3cb');root.querySelectorAll('.cg-piece').forEach(p=>p.style.transition=config.motion?'':'none')}
render();if(globalThis.Tweak){const t=new globalThis.Tweak({container:root,onChange:applyDesign});t.addSelect(config,'board',{label:'Board finish',options:['Sage','Oak']});t.addToggle(config,'motion',{label:'Piece movement'});}
})();
</script>
