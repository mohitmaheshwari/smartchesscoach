<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #FABD23; } a:hover { color: #FFD569; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0D14; color: #F2F3F7; display: flex; flex-direction: column; box-sizing: border-box; padding: 20px 16px 24px;">

  <!-- header -->
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;">
    <div style="font-family: 'Outfit', system-ui, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.14em; color: #8A90A2;">TODAY</div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A90A2" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
      </svg>
      <span style="font-size: 13px; color: #8A90A2;">3 min</span>
    </div>
  </div>

  <!-- the coach's one line -->
  <div style="margin-bottom: 20px;">
    <p style="margin: 0; font-family: 'Outfit', system-ui, sans-serif; font-size: 20px; line-height: 1.35; font-weight: 500; color: #F2F3F7; text-wrap: pretty;">Yesterday, move 19 &mdash; the bishop again.</p>
    <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: #8A90A2;">Eight quick ones.</p>
  </div>

  <!-- board -->
  <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); width: 358px; height: 358px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,0.45);">
    <sc-for list="{{squares}}" as="sq" hint-placeholder-count="64">
      <div style="{{sq.sqStyle}}">
        <span style="{{sq.pieceStyle}}">{{sq.glyph}}</span>
      </div>
    </sc-for>
  </div>

  <!-- prompt -->
  <p style="margin: 22px 0 0; font-size: 17px; line-height: 1.4; color: #F2F3F7; font-weight: 500;">You want to play <span style="font-family: 'Outfit', system-ui, sans-serif; font-weight: 600;">Bg5</span>.</p>

  <!-- answers -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px;">
    <div style="height: 54px; display: flex; align-items: center; justify-content: center; border: 1px solid #2A3040; border-radius: 10px; font-size: 16px; font-weight: 600; color: #F2F3F7; background: #12151F;">Safe</div>
    <div style="height: 54px; display: flex; align-items: center; justify-content: center; border: 1px solid #2A3040; border-radius: 10px; font-size: 16px; font-weight: 600; color: #F2F3F7; background: #12151F;">Not safe</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- progress -->
  <div style="display: flex; align-items: center; gap: 10px;">
    <div style="display: flex; gap: 5px; flex-grow: 1;">
      <sc-for list="{{pips}}" as="p" hint-placeholder-count="8">
        <div style="{{p.style}}"></div>
      </sc-for>
    </div>
    <span style="font-size: 13px; color: #8A90A2; font-variant-numeric: tabular-nums;">3 / 8</span>
  </div>

</div>
</x-dc>

<script data-dc-script>
const G = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
const LIGHT = '#C6CAD4';
const DARK = '#6A7186';

class Component extends DCLogic {
  buildSquares(rows, marks) {
    const out = [];
    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        const ch = rows[r][f];
        const name = 'abcdefgh'[f] + (8 - r);
        const light = (r + f) % 2 === 0;
        const m = marks[name] || null;
        const isWhite = ch !== '.' && ch === ch.toUpperCase();

        let glyph = '';
        let pieceStyle = 'font-size:30px;line-height:1;';
        if (ch !== '.') {
          glyph = G[ch.toLowerCase()];
          pieceStyle += isWhite
            ? 'color:#FFFFFF;text-shadow:0 0 1px rgba(0,0,0,.9),0 1px 2px rgba(0,0,0,.45);'
            : 'color:#12141C;text-shadow:0 0 1px rgba(255,255,255,.22);';
        } else if (m && m.ghost) {
          glyph = G[m.ghost];
          pieceStyle += 'color:#FFFFFF;opacity:.38;';
        }

        out.push({
          key: name,
          glyph: glyph,
          pieceStyle: pieceStyle,
          sqStyle: 'display:flex;align-items:center;justify-content:center;background:'
            + (light ? LIGHT : DARK) + ';' + (m ? (m.sq || '') : '')
        });
      }
    }
    return out;
  }

  renderVals() {
    // Italian-ish middlegame. White bishop on c1 wants g5; the h6 pawn covers it.
    const rows = [
      'r.bqk..r',
      'pppp.pp.',
      '..n..n.p',
      '..b.p...',
      '..B.P...',
      '...P.N..',
      'PPP..PPP',
      'RNBQ.RK.'
    ];
    const marks = {
      c1: { sq: 'box-shadow: inset 0 0 0 3px rgba(250,189,35,.75);' },
      g5: { sq: 'box-shadow: inset 0 0 0 3px #FABD23;', ghost: 'b' }
    };
    const pips = [];
    for (let i = 0; i < 8; i++) {
      pips.push({
        style: 'height:3px;flex-grow:1;border-radius:2px;background:'
          + (i < 3 ? '#FABD23' : '#232838') + ';'
      });
    }
    return { squares: this.buildSquares(rows, marks), pips: pips };
  }
}
</script>
</body>
</html>
