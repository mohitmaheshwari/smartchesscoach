<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #FABD23; } a:hover { color: #FFD569; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #0B0D14; color: #F2F3F7; display: flex; box-sizing: border-box;">

  <div style="width: 232px; flex-shrink: 0; border-right: 1px solid #191D28; display: flex; flex-direction: column; padding: 32px 20px; box-sizing: border-box;">
    <div style="font-family: 'Outfit', system-ui, sans-serif; font-size: 19px; font-weight: 700; padding: 0 10px; margin-bottom: 36px;">Chess<span style="color: #FABD23;">Guru</span></div>
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 9px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A90A2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <span style="font-size: 15px; font-weight: 500; color: #8A90A2;">Today</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 9px; background: #1A1508;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FABD23" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l13 8-13 8V4z"></path></svg>
        <span style="font-size: 15px; font-weight: 600; color: #FABD23;">Play</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 9px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A90A2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
        <span style="font-size: 15px; font-weight: 500; color: #8A90A2;">Review</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 9px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A90A2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"></path></svg>
        <span style="font-size: 15px; font-weight: 500; color: #8A90A2;">Plan</span>
      </div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px;">
      <div style="width: 30px; height: 30px; border-radius: 50%; background: #9B2734; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff;">M</div>
      <div><div style="font-size: 13px; font-weight: 600;">Mohit</div><div style="font-size: 11px; color: #6E7488;">1042</div></div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; justify-content: center; align-items: flex-start; padding: 48px 0; box-sizing: border-box;">
    <div style="display: flex; gap: 34px; align-items: flex-start;">

      <!-- board column -->
      <div style="display: flex; flex-direction: column; width: 480px;">
        <div style="display: flex; align-items: center; gap: 11px; margin-bottom: 16px;">
          <div style="width: 30px; height: 30px; border-radius: 8px; background: #1B2030; display: flex; align-items: center; justify-content: center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A90A2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21h12l-1-7H7l-1 7z"></path><path d="M8 14V9a4 4 0 0 1 8 0v5"></path></svg>
          </div>
          <div style="flex-grow: 1;">
            <div style="font-size: 14px; font-weight: 600;">Coach</div>
            <div style="font-size: 12px; color: #8A90A2;">playing at your level</div>
          </div>
          <span style="font-size: 15px; color: #8A90A2; font-variant-numeric: tabular-nums;">8:24</span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); width: 480px; height: 480px; border-radius: 8px; overflow: hidden; box-shadow: 0 14px 40px rgba(0,0,0,0.5);">
          <sc-for list="{{squares}}" as="sq" hint-placeholder-count="64">
            <div style="{{sq.sqStyle}}"><span style="{{sq.pieceStyle}}">{{sq.glyph}}</span></div>
          </sc-for>
        </div>

        <!-- the guardian asks; it does not lecture -->
        <div style="margin-top: 22px; background: #161B27; border: 1px solid #2A3040; border-radius: 14px; padding: 20px;">
          <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 12px;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FABD23" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6l7-3z"></path></svg>
            <span style="font-family: 'Outfit', system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #FABD23;">HOLD ON</span>
          </div>
          <p style="margin: 0 0 18px; font-family: 'Outfit', system-ui, sans-serif; font-size: 20px; line-height: 1.35; font-weight: 500; text-wrap: pretty;">Look at d4 again &mdash; who&#39;s watching that square?</p>
          <div style="display: flex; gap: 12px;">
            <div style="height: 46px; padding: 0 22px; display: flex; align-items: center; border-radius: 10px; background: #FABD23; color: #16120A; font-size: 15px; font-weight: 700;">Let me look</div>
            <div style="height: 46px; padding: 0 22px; display: flex; align-items: center; border-radius: 10px; border: 1px solid #2A3040; color: #A9AFBF; font-size: 15px; font-weight: 600;">I&#39;m sure</div>
          </div>
        </div>
      </div>

      <!-- moves: quiet, functional, not a card stack -->
      <div style="width: 244px; padding-top: 62px;">
        <div style="font-family: 'Outfit', system-ui, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #6E7488; margin-bottom: 14px;">MOVES</div>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <sc-for list="{{moves}}" as="m" hint-placeholder-count="10">
            <div style="display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 6px;">
              <span style="width: 22px; font-size: 12px; color: #575D70; font-variant-numeric: tabular-nums;">{{m.no}}</span>
              <span style="{{m.wStyle}}">{{m.w}}</span>
              <span style="{{m.bStyle}}">{{m.b}}</span>
            </div>
          </sc-for>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
const G = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
const LIGHT = '#C6CAD4';
const DARK = '#6A7186';

class Component extends DCLogic {
  buildSquares(rows, marks) {
    const out = [];
    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        const ch = rows[r][f];
        const name = 'abcdefgh'[f] + (8 - r);
        const light = (r + f) % 2 === 0;
        const m = marks[name] || null;
        const isWhite = ch !== '.' && ch === ch.toUpperCase();
        let glyph = '';
        let pieceStyle = 'font-size:40px;line-height:1;';
        if (ch !== '.') {
          glyph = G[ch.toLowerCase()];
          pieceStyle += isWhite
            ? 'color:#FFFFFF;text-shadow:0 0 1px rgba(0,0,0,.9),0 2px 3px rgba(0,0,0,.45);'
            : 'color:#12141C;text-shadow:0 0 1px rgba(255,255,255,.22);';
        } else if (m && m.ghost) {
          glyph = G[m.ghost];
          pieceStyle += 'color:#FFFFFF;opacity:.38;';
        }
        out.push({
          key: name, glyph: glyph, pieceStyle: pieceStyle,
          sqStyle: 'display:flex;align-items:center;justify-content:center;background:'
            + (light ? LIGHT : DARK) + ';' + (m ? (m.sq || '') : '')
        });
      }
    }
    return out;
  }

  renderVals() {
    const rows = [
      'r.bq.rk.', 'ppp..ppp', '..np.n..', '....p...',
      '..B.P...', '..NP.N..', 'PPP..PPP', 'R.BQ.RK.'
    ];
    const marks = {
      f3: { sq: 'box-shadow: inset 0 0 0 4px rgba(250,189,35,.7);' },
      d4: { sq: 'box-shadow: inset 0 0 0 4px #9B2734;', ghost: 'n' }
    };
    const raw = [
      ['1', 'e4', 'e5'], ['2', 'Nf3', 'Nc6'], ['3', 'Bc4', 'Nf6'],
      ['4', 'd3', 'Bc5'], ['5', 'Nc3', 'd6'], ['6', 'O-O', 'O-O'],
      ['7', 'Bg5', 'h6'], ['8', 'Bh4', 'g5'], ['9', 'Bg3', 'Bg4'],
      ['10', 'Nd4', '']
    ];
    const base = 'font-size:13px;font-weight:500;width:52px;';
    const moves = raw.map(function (m, i) {
      const live = i === raw.length - 1;
      return {
        no: m[0], w: m[1], b: m[2],
        wStyle: base + (live ? 'color:#FABD23;font-weight:700;' : 'color:#C2C7D4;'),
        bStyle: base + 'color:#8A90A2;'
      };
    });
    return { squares: this.buildSquares(rows, marks), moves: moves };
  }
}
</script>
</body>
</html>
