<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #FABD23; } a:hover { color: #FFD569; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B0D14; color: #F2F3F7; display: flex; flex-direction: column; box-sizing: border-box; padding: 20px 16px 24px;">

  <!-- game meta -->
  <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 16px;">
    <span style="font-family: 'Outfit', system-ui, sans-serif; font-size: 16px; font-weight: 600; color: #F2F3F7;">vs Marcus</span>
    <span style="font-size: 13px; color: #8A90A2;">3 days ago</span>
    <div style="flex-grow: 1;"></div>
    <span style="font-size: 13px; font-weight: 600; color: #C4636D;">Lost</span>
  </div>

  <!-- recurrence: the thing no other product says -->
  <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; background: #2A1418; border: 1px solid #4A2028; border-radius: 999px; padding: 8px 14px; margin-bottom: 18px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E0838C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path>
    </svg>
    <span style="font-size: 13px; font-weight: 600; color: #E0838C;">3rd time this month</span>
  </div>

  <!-- board: the geometry, not a diagram of the engine line -->
  <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); width: 358px; height: 358px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,0.45);">
    <sc-for list="{{squares}}" as="sq" hint-placeholder-count="64">
      <div style="{{sq.sqStyle}}">
        <span style="{{sq.pieceStyle}}">{{sq.glyph}}</span>
      </div>
    </sc-for>
  </div>

  <!-- what actually went wrong -->
  <div style="margin-top: 20px;">
    <div style="font-family: 'Outfit', system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #8A90A2; margin-bottom: 9px;">MOVE 19 &middot; Bg5</div>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #F2F3F7; text-wrap: pretty;">The h&#8209;pawn was already covering that square before you moved.</p>
    <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: #9AA0B0; text-wrap: pretty;">You commit the piece, then look. That&#39;s the thing we&#39;re working on.</p>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- move nav -->
  <div style="display: flex; align-items: center; gap: 12px;">
    <div style="width: 52px; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #2A3040; border-radius: 10px; background: #12151F;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9AFBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </div>
    <div style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #FABD23; color: #16120A; font-size: 15px; font-weight: 700;">Practise this</div>
    <div style="width: 52px; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #2A3040; border-radius: 10px; background: #12151F;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9AFBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script>
const G = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
const LIGHT = '#C6CAD4';
const DARK = '#6A7186';

class Component extends DCLogic {
  buildSquares(rows, marks) {
    const out = [];
    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        const ch = rows[r][f];
        const name = 'abcdefgh'[f] + (8 - r);
        const light = (r + f) % 2 === 0;
        const m = marks[name] || null;
        const isWhite = ch !== '.' && ch === ch.toUpperCase();

        let glyph = '';
        let pieceStyle = 'font-size:30px;line-height:1;';
        if (ch !== '.') {
          glyph = G[ch.toLowerCase()];
          pieceStyle += isWhite
            ? 'color:#FFFFFF;text-shadow:0 0 1px rgba(0,0,0,.9),0 1px 2px rgba(0,0,0,.45);'
            : 'color:#12141C;text-shadow:0 0 1px rgba(255,255,255,.22);';
        } else if (m && m.ghost) {
          glyph = G[m.ghost];
          pieceStyle += 'color:#FFFFFF;opacity:.38;';
        }

        out.push({
          key: name,
          glyph: glyph,
          pieceStyle: pieceStyle,
          sqStyle: 'display:flex;align-items:center;justify-content:center;background:'
            + (light ? LIGHT : DARK) + ';' + (m ? (m.sq || '') : '')
        });
      }
    }
    return out;
  }

  renderVals() {
    // The position AFTER Bg5 was played. h6 takes it.
    const rows = [
      'r.bqk..r',
      'pppp.pp.',
      '..n..n.p',
      '..b.p.B.',
      '..B.P...',
      '...P.N..',
      'PPP..PPP',
      'RN.Q.RK.'
    ];
    const marks = {
      g5: { sq: 'box-shadow: inset 0 0 0 3px #9B2734;' },
      h6: { sq: 'box-shadow: inset 0 0 0 3px #FABD23;' }
    };
    return { squares: this.buildSquares(rows, marks) };
  }
}
</script>
</body>
</html>
