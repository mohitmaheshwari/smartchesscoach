<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #FABD23; } a:hover { color: #FFD569; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #0B0D14; color: #F2F3F7; display: flex; box-sizing: border-box;">

  <div style="width: 232px; flex-shrink: 0; border-right: 1px solid #191D28; display: flex; flex-direction: column; padding: 32px 20px; box-sizing: border-box;">
    <div style="font-family: 'Outfit', system-ui, sans-serif; font-size: 19px; font-weight: 700; padding: 0 10px; margin-bottom: 36px;">Chess<span style="color: #FABD23;">Guru</span></div>
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 9px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A90A2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <span style="font-size: 15px; font-weight: 500; color: #8A90A2;">Today</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 9px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A90A2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l13 8-13 8V4z"></path></svg>
        <span style="font-size: 15px; font-weight: 500; color: #8A90A2;">Play</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 9px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A90A2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
        <span style="font-size: 15px; font-weight: 500; color: #8A90A2;">Review</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 9px; background: #1A1508;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FABD23" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"></path></svg>
        <span style="font-size: 15px; font-weight: 600; color: #FABD23;">Plan</span>
      </div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px;">
      <div style="width: 30px; height: 30px; border-radius: 50%; background: #9B2734; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff;">M</div>
      <div><div style="font-size: 13px; font-weight: 600;">Mohit</div><div style="font-size: 11px; color: #6E7488;">1042</div></div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; justify-content: center; padding: 64px 0; box-sizing: border-box;">
    <div style="width: 760px; display: flex; flex-direction: column;">

      <div style="font-family: 'Outfit', system-ui, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.14em; color: #8A90A2; margin-bottom: 18px;">YOUR PLAN</div>

      <h1 style="margin: 0; font-family: 'Outfit', system-ui, sans-serif; font-size: 40px; line-height: 1.15; font-weight: 600; text-wrap: pretty;">The square you don&#39;t check</h1>
      <p style="margin: 12px 0 0; font-size: 16px; color: #8A90A2;">Moving pieces where they can be taken</p>

      <!-- four stages, criteria not dates -->
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 40px;">
        <sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
          <div style="{{s.cardStyle}}">
            <div style="{{s.iconWrap}}"><span style="{{s.iconStyle}}">{{s.icon}}</span></div>
            <div style="{{s.titleStyle}}">{{s.title}}</div>
            <div style="font-size: 12px; line-height: 1.45; color: #7C8296; margin-top: 5px;">{{s.detail}}</div>
          </div>
        </sc-for>
      </div>

      <!-- the number, countable, from their own games -->
      <div style="margin-top: 34px; background: #12151F; border: 1px solid #232838; border-radius: 16px; padding: 26px 28px;">
        <div style="display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px;">
          <span style="font-family: 'Outfit', system-ui, sans-serif; font-size: 38px; font-weight: 700; color: #FABD23; line-height: 1; font-variant-numeric: tabular-nums;">14</span>
          <span style="font-size: 16px; color: #8A90A2;">of 20 clean in real games</span>
        </div>
        <div style="display: flex; gap: 4px;">
          <sc-for list="{{ticks}}" as="t" hint-placeholder-count="20">
            <div style="{{t.style}}"></div>
          </sc-for>
        </div>
        <p style="margin: 16px 0 0; font-size: 15px; color: #A9AFBF;">Six more clean decisions and this is done.</p>
      </div>

      <div style="display: flex; align-items: center; gap: 20px; margin-top: 34px;">
        <div style="height: 54px; padding: 0 30px; display: flex; align-items: center; border-radius: 11px; background: #FABD23; color: #16120A; font-size: 16px; font-weight: 700;">Today &middot; 8 reps &middot; 3 min</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 14px; color: #6E7488;">Next up</span>
          <span style="font-size: 14px; color: #9AA0B0;">your king gets exposed early</span>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const defs = [
      { title: 'See it', detail: '8 of 8 reps, no hints', state: 'done' },
      { title: 'Do it', detail: 'passed with no help', state: 'done' },
      { title: 'Prove it', detail: 'in real games', state: 'current' },
      { title: 'Fixed', detail: 'not yet', state: 'todo' }
    ];

    const stages = defs.map(function (d) {
      let icon = '';
      let iconWrap = 'width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:14px;';
      let iconStyle = 'font-size:14px;line-height:1;font-weight:700;';
      let cardStyle = 'padding:20px 18px;border-radius:13px;border:1px solid ';

      if (d.state === 'done') {
        icon = '✓';
        iconWrap += 'background:#1E3A28;';
        iconStyle += 'color:#5FD08A;';
        cardStyle += '#1F2431;background:#10131C;';
      } else if (d.state === 'current') {
        icon = '→';
        iconWrap += 'background:#FABD23;';
        iconStyle += 'color:#16120A;';
        cardStyle += '#4A3A10;background:#171307;';
      } else {
        iconWrap += 'background:transparent;border:1.5px solid #2A3040;';
        cardStyle += '#191D28;background:transparent;';
      }

      return {
        title: d.title, detail: d.detail, icon: icon,
        iconWrap: iconWrap, iconStyle: iconStyle, cardStyle: cardStyle,
        titleStyle: 'font-family:Outfit,system-ui,sans-serif;font-size:17px;font-weight:600;'
          + (d.state === 'todo' ? 'color:#6E7488;' : 'color:#F2F3F7;')
      };
    });

    const ticks = [];
    for (let i = 0; i < 20; i++) {
      ticks.push({
        style: 'height:10px;flex-grow:1;border-radius:3px;background:' + (i < 14 ? '#FABD23' : '#252A3A') + ';'
      });
    }
    return { stages: stages, ticks: ticks };
  }
}
</script>
</body>
</html>
