
# Initial HTTP Redirect Config Only (SSL Will Be Added Later)
server {
    listen 80;
    server_name chessguru.ai www.chessguru.ai;

    if ($host = 7B.attendance.delightrgext.xyz) {
        return 301 https://$host$request_uri;
    }

    return 404; # managed by Certbot

    
}

# Secure HTTPS Server
server {
    listen 443 ssl http2;
    server_name chessguru.ai www.chessguru.ai;

    ssl_certificate /etc/letsencrypt/live/chessguru.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chessguru.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    include /etc/nginx/snippets/chessguru-security-headers.conf;

    root /var/www/chessguru.ai;
    index index.html;

 

    # Gzip Compression
    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css;

    # Cache Headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        include /etc/nginx/snippets/chessguru-security-headers.conf;
        add_header Cache-Control "public, no-transform";
    }

    # SPA Routing
    location / {
        try_files $uri /index.html;
    }

    location /api/coach/play/events/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';

        proxy_set_header   Host $host;	
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}




