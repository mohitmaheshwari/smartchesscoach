# Security headers. "always" so they are sent on error responses too.
# NOTE: nginx add_header does NOT inherit into a location that declares its
# own add_header, so this snippet must be included in every such location.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Report-Only first: an enforcing CSP needs an audit of the app real resource
# origins (wasm workers, fonts, analytics) or it white-screens the product.
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; connect-src 'self' https:; worker-src 'self' blob:" always;
