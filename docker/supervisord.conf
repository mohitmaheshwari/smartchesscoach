[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.out.log
stderr_logfile=/var/log/supervisor/nginx.err.log

[program:backend]
command=uvicorn server:app --host 0.0.0.0 --port 8002
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/backend.out.log
stderr_logfile=/var/log/supervisor/backend.err.log
environment=PYTHONUNBUFFERED="1"

[program:analysis_workers]
command=python3 analysis_worker.py
directory=/app/backend
autostart=true
autorestart=true
numprocs=5
process_name=%(program_name)s_%(process_num)s
stdout_logfile=/var/log/supervisor/%(program_name)s_%(process_num)s.out.log
stderr_logfile=/var/log/supervisor/%(program_name)s_%(process_num)s.err.log
environment=PYTHONUNBUFFERED="1"
