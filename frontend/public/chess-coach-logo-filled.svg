<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="knightGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="72" fill="#0b1120"/>

  <!-- Filled chess knight -->
  <text x="240" y="360" 
    font-family="serif" 
    font-size="360" 
    fill="#e2e4ea" 
    text-anchor="middle"
    filter="url(#knightGlow)">&#9822;</text>

  <!-- Neural circuit from the head -->
  <g>
    <path d="
      M 290 120
      C 312 104, 345 100, 365 118
      C 385 136, 380 162, 362 178
      C 345 194, 330 186, 324 202
      C 318 218, 328 236, 350 242
    " stroke="url(#glow)" stroke-width="2.8" fill="none" stroke-linecap="round"/>

    <circle cx="290" cy="120" r="6" fill="#3b82f6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="365" cy="118" r="5" fill="#60a5fa">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="362" cy="178" r="5.5" fill="#3b82f6">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="242" r="6" fill="#60a5fa">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <line x1="365" y1="118" x2="390" y2="90" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <circle cx="390" cy="90" r="3" fill="#60a5fa" opacity="0.4"/>

    <line x1="362" y1="178" x2="394" y2="165" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <circle cx="394" cy="165" r="2.5" fill="#60a5fa" opacity="0.3"/>
  </g>
</svg>
